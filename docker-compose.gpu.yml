# GPU override - enables NVIDIA GPU for Hunyuan3D
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build -d

services:
  hunyuan:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility